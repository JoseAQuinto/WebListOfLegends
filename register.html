<!DOCTYPE html>
<html class="dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List of Legends | Create account</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0db9f2",
              "background-light": "#f5f8f8",
              "background-dark": "#0a0a0c",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>

    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glow-effect {
        position: absolute;
        width: 420px;
        height: 420px;
        z-index: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen relative overflow-hidden flex flex-col"
  >
    <!-- Background Orbs -->
    <div
      class="glow-effect top-[-10%] left-[-5%]"
      style="
        background: radial-gradient(
          circle,
          rgba(13, 185, 242, 0.1) 0%,
          rgba(13, 185, 242, 0) 70%
        );
      "
    ></div>
    <div
      class="glow-effect bottom-[-10%] right-[-5%]"
      style="
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.1) 0%,
          rgba(139, 92, 246, 0) 70%
        );
      "
    ></div>

    <!-- Header -->
    <header
      class="relative z-10 w-full px-6 py-6 lg:px-12 flex justify-between items-center"
    >
      <a href="./index.html" class="flex items-center gap-2">
        <div class="bg-primary p-1.5 rounded-lg">
          <svg
            class="w-6 h-6 text-background-dark"
            fill="currentColor"
            viewBox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"
            ></path>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight dark:text-white"
          >List of Legends</span
        >
      </a>

      <a
        href="./index.html"
        class="px-4 py-2 text-sm font-bold border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        Volver al login
      </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 relative z-10">
      <div class="w-full max-w-[520px]">
        <section class="glass-card rounded-xl p-8 shadow-2xl relative overflow-hidden">
          <div
            class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-primary/10 rounded-full blur-3xl"
          ></div>

          <div class="mb-8 text-center">
            <h1 class="text-3xl font-black mb-2 dark:text-white text-slate-900">
              Create your account
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">
              Regístrate para guardar tus cuentas y sincronizarlas con Supabase.
            </p>
          </div>

          <form id="registerForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium mb-1.5 dark:text-slate-300 text-slate-700">
                Email
              </label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">
                  mail
                </span>
                <input
                  id="regEmail"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="name@example.com"
                  class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-white"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1.5 dark:text-slate-300 text-slate-700">
                Password
              </label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">
                  lock
                </span>
                <input
                  id="regPassword"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="6"
                  placeholder="Mínimo 6 caracteres"
                  class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-white"
                />
              </div>
              <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
                Consejo: usa una contraseña de al menos 8 caracteres.
              </p>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1.5 dark:text-slate-300 text-slate-700">
                Repite password
              </label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">
                  lock
                </span>
                <input
                  id="regPassword2"
                  type="password"
                  autocomplete="new-password"
                  required
                  placeholder="Repite la contraseña"
                  class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-white"
                />
              </div>
            </div>

            <button
              id="btnRegister"
              type="submit"
              class="w-full py-3.5 bg-primary hover:bg-primary/90 text-background-dark font-bold rounded-lg transition-transform active:scale-[0.98] flex items-center justify-center gap-2"
            >
              <span>Create account</span>
              <span class="material-symbols-outlined text-[18px]">person_add</span>
            </button>
          </form>

          <div
            id="registerMsg"
            class="hidden mt-5 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/40 px-4 py-3 text-slate-700 dark:text-slate-200"
          ></div>

          <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-center">
            <p class="text-sm text-slate-500">
              ¿Ya tienes cuenta?
              <a class="text-primary font-bold hover:underline ml-1" href="./index.html">
                Volver al login
              </a>
            </p>
          </div>
        </section>
      </div>
    </main>

    <footer class="relative z-10 py-8 px-6 text-center">
      <p class="text-[10px] text-slate-600 dark:text-slate-600 max-w-2xl mx-auto uppercase tracking-widest">
        List of Legends isn't endorsed by Riot Games.
      </p>
    </footer>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./register.js"></script>
  </body>
</html>
